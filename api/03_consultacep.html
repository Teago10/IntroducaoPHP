<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta CEP</title>
</head>

<body>

    <form action="03_consultacep.php" method="post">

        <h2>Consulta CEP</h2>

        <label for="cep">CEP:</label>

        <input
            type="text"
            id="cep"
            name="cep"
            placeholder="Digite o CEP"
            maxlength="8"
            pattern="[0-9]{8}"
            required>

        <br><br>

        <button type="submit">Consultar</button>

    </form>

</body>

</html>
