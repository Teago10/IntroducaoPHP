<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="08frmCadConta.php" method="POST">

        <h3>Insira as informações da Conta</h3>
        <label for="tipoDeConta">Tipo de Conta</label><br>
        <select name="tipoDeConta" id="tipoDeConta">
            <option value="Poupança">Poupança</option>
            <option value="Especial">Especial</option>
        </select><br><br>
        <label for="agencia">Agência</label><br>
        <input type="text" id="agencia" name="agencia" required><br><br>

        <label for="conta">Conta</label><br>
        <input type="text" id="conta" name="conta" required><br><br>

        <label for="saldoInicial">Saldo Inicial</label><br>
        <input type="number" id="saldoInicial" name="saldoInicial" required><br><br>

        <label for="reajuste">Reajuste (%) (Poupança)</label><br>
        <input type="number" step="0.01" id="reajuste" name="reajuste"><br><br>

        <label for="limiteEspecial">Limite Especial (Conta Especial)</label><br>
        <input type="number" step="0.01" name="limiteEspecial" id="limiteEspecial"><br><br>

        <button type="submit" id="enviar">Enviar</button>
    </form>
</body>
</html>
